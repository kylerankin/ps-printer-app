name: Publish signed FSDK OCI image

# Every push to main (merged through the merge queue, whose required
# FSDK checks already built and verified it) is rebuilt, verified, signed and
# published. Reverting a pull request is the rollback.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: oci-publish
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ps-printer-app

jobs:
  metadata:
    # Publishing stays held until the PPD-upload security sign-off (ps#198);
    # a maintainer lifts the hold by setting the PS_PUBLISH_APPROVED repository
    # variable to true.
    if: vars.PS_PUBLISH_APPROVED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      created: ${{ steps.release.outputs.created }}
      fsdk_version: ${{ steps.release.outputs.fsdk_version }}
      fsdk_ref: ${{ steps.release.outputs.fsdk_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install release inspection tools
        run: sudo apt-get update && sudo apt-get install --yes skopeo
      - name: Derive version and FSDK pin, refuse an already published commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # VERSION is the foomatic-db snapshot date plus a packaging revision,
          # and the only version source: printer-app/version.bst stages it and
          # oci/ps-printer-app.bst reads it into the image version label.
          version="$(< VERSION)"
          [[ "$version" =~ ^[0-9]{8}-[0-9]+$ ]]
          revision="$(git rev-parse HEAD)"
          # The FSDK labels are derived from the junction here, never committed,
          # so a bare fsdk-containers ref bump is a complete update.
          junction_ref="$(sed -n -E 's/^[[:space:]]*ref: (.*-g)?([0-9a-f]{40})$/\2/p' elements/fsdk-containers.bst)"
          [[ "$junction_ref" =~ ^[0-9a-f]{40}$ ]]
          # The same script `just validate` checks the pin with (tests/source-pins.sh),
          # so a junction bump that merged can be labelled here.
          # Assign first: a failure inside a here-string's $(...) would not stop set -e.
          fsdk_pin="$(scripts/fsdk-pin.sh "$junction_ref")"
          read -r fsdk_version fsdk_ref <<< "$fsdk_pin"
          [[ -n "$fsdk_version" && "$fsdk_ref" =~ ^[0-9a-f]{40}$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="${image%/*}/ps-printer-app"
          if probe="$(skopeo inspect --creds "$GITHUB_ACTOR:$GH_TOKEN" "docker://${image}:sha-${revision}" 2>&1)"; then
            printf 'Refusing to overwrite immutable tag %s:sha-%s\n' "$image" "$revision" >&2
            exit 1
          elif [[ "${probe,,}" != *'manifest unknown'* && "${probe,,}" != *'name unknown'* ]]; then
            printf 'Could not prove %s:sha-%s absent: %s\n' "$image" "$revision" "$probe" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "revision=$revision"
            echo "created=$(git show -s --format=%cI HEAD)"
            echo "fsdk_version=$fsdk_version"
            echo "fsdk_ref=$fsdk_ref"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      BST_FLAGS: --config /src/ci/buildstream.conf
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: just
      - name: Install image build dependencies
        run: sudo apt-get update && sudo apt-get install --yes fuse3 podman skopeo jq umoci
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Fetch, build and print with native OCI image
        run: just build && just verify
      - name: Stamp verified image with release provenance
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
          CREATED: ${{ needs.metadata.outputs.created }}
          FSDK_VERSION: ${{ needs.metadata.outputs.fsdk_version }}
          FSDK_REF: ${{ needs.metadata.outputs.fsdk_ref }}
        run: |
          set -euo pipefail
          # Change only the image configuration, never its layer blobs.
          skopeo copy --preserve-digests oci:.build-out oci:release:build
          umoci config --image release:build \
            --config.label "org.opencontainers.image.version=$VERSION" \
            --config.label "org.opencontainers.image.revision=$REVISION" \
            --config.label "org.opencontainers.image.created=$CREATED" \
            --config.label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --config.label "io.projectbluefin.fsdk.version=$FSDK_VERSION" \
            --config.label "io.projectbluefin.fsdk.ref=$FSDK_REF"
          parent="$(skopeo inspect --raw oci:runtime-parent:layer | jq -r '.layers[0].digest')"
          child="$(skopeo inspect --raw oci:release:build | jq -r '.layers[0].digest')"
          echo "parent=$parent child=$child"
          [[ "$parent" == sha256:* && "$parent" == "$child" ]]
          tar -C release -cf "ps-${{ matrix.arch }}.oci" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ps-${{ matrix.arch }}
          path: ps-${{ matrix.arch }}.oci
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BST_FLAGS: --config /src/ci/buildstream.conf
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ps-*
          merge-multiple: true
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: just
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install registry tools
        run: sudo apt-get update && sudo apt-get install --yes fuse3 jq podman skopeo
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      - name: Generate BuildStream-native SPDX SBOM
        run: just fetch && just sbom
      # Everything is pushed, signed, attested and verified by digest; the
      # tags are created only in the final step, so a failed publish never
      # leaves a tagged, unsigned image behind.
      - name: Publish architecture manifests and OCI index by digest
        id: image
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
          CREATED: ${{ needs.metadata.outputs.created }}
          FSDK_VERSION: ${{ needs.metadata.outputs.fsdk_version }}
          FSDK_REF: ${{ needs.metadata.outputs.fsdk_ref }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="${image%/*}/ps-printer-app"
          authfile="$HOME/.docker/config.json"
          sources=()
          for arch in x86_64 aarch64; do
            platform="$([[ "$arch" == x86_64 ]] && echo amd64 || echo arm64)"
            archive="ps-${arch}.oci"
            mkdir "layout-${arch}"
            tar -xf "$archive" -C "layout-${arch}"
            layout="$(cat "layout-${arch}/index.json")"
            jq -e '.manifests | length == 1' <<< "$layout" >/dev/null
            digest="$(jq -r '.manifests[0].digest' <<< "$layout")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            skopeo copy --preserve-digests --authfile "$authfile" "oci:layout-${arch}:build" "docker://${image}@${digest}"
            source="${image}@${digest}"
            [[ "$(skopeo inspect --no-tags --authfile "$authfile" "docker://${source}" | jq -r .Architecture)" == "$platform" ]]
            skopeo inspect --config --authfile "$authfile" "docker://${source}" | jq -e \
              --arg version "$VERSION" --arg revision "$REVISION" --arg created "$CREATED" \
              --arg fsdk_version "$FSDK_VERSION" --arg fsdk_ref "$FSDK_REF" \
              '.config.User == "65532:65532" and
               .config.Labels["org.opencontainers.image.title"] == "ps-printer-app" and
               .config.Labels["org.opencontainers.image.version"] == $version and
               .config.Labels["org.opencontainers.image.revision"] == $revision and
               .config.Labels["org.opencontainers.image.created"] == $created and
               .config.Labels["io.projectbluefin.fsdk.version"] == $fsdk_version and
               .config.Labels["io.projectbluefin.fsdk.ref"] == $fsdk_ref'
            sources+=("$source")
            echo "${arch}-digest=$digest" >> "$GITHUB_OUTPUT"
          done
          docker buildx imagetools create --dry-run \
            --tag "${image}:${VERSION}" \
            --annotation 'index:org.opencontainers.image.title=ps-printer-app' \
            --annotation 'index:org.opencontainers.image.description=PostScript Printer Application built from freedesktop-sdk' \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation 'index:org.opencontainers.image.licenses=Apache-2.0' \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$REVISION" \
            --annotation "index:org.opencontainers.image.created=$CREATED" \
            --annotation "index:io.projectbluefin.fsdk.version=$FSDK_VERSION" \
            --annotation "index:io.projectbluefin.fsdk.ref=$FSDK_REF" \
            "${sources[@]}" > index.json
          digest="sha256:$(sha256sum index.json | cut -d' ' -f1)"
          oras manifest push --media-type application/vnd.oci.image.index.v1+json "${image}@${digest}" index.json
          [[ "$(skopeo inspect --raw --authfile "$authfile" "docker://${image}@${digest}" | sha256sum | cut -d' ' -f1)" == "${digest#sha256:}" ]]
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign index and architecture manifests and attach signed SPDX SBOM
        id: evidence
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --recursive "${IMAGE}@${DIGEST}"
          sbom_digest="$(oras attach --format json --no-tty \
            --artifact-type application/vnd.spdx+json \
            --annotation org.opencontainers.image.title=ps-printer-app-sbom \
            "${IMAGE}@${DIGEST}" \
            ps-printer-app.spdx.json:application/spdx+json | jq -r .digest)"
          [[ "$sbom_digest" == sha256:* ]]
          cosign sign --yes "${IMAGE}@${sbom_digest}"
          echo "sbom-digest=$sbom_digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Verify registry index, signatures, SBOM and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SBOM_DIGEST: ${{ steps.evidence.outputs.sbom-digest }}
          X86_64_DIGEST: ${{ steps.image.outputs.x86_64-digest }}
          AARCH64_DIGEST: ${{ steps.image.outputs.aarch64-digest }}
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
          CREATED: ${{ needs.metadata.outputs.created }}
          FSDK_VERSION: ${{ needs.metadata.outputs.fsdk_version }}
          FSDK_REF: ${{ needs.metadata.outputs.fsdk_ref }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/registry-actions.yml@${GITHUB_REF}"
          cosign verify --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "${IMAGE}@${DIGEST}"
          cosign verify --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "${IMAGE}@${SBOM_DIGEST}"
          for arch_digest in "$X86_64_DIGEST" "$AARCH64_DIGEST"; do
            cosign verify --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "${IMAGE}@${arch_digest}"
          done
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$GITHUB_REPOSITORY"
          oras discover --format json "${IMAGE}@${DIGEST}" | jq -e \
            --arg digest "$SBOM_DIGEST" \
            '.referrers[] | select(.digest == $digest and .artifactType == "application/vnd.spdx+json")'
          raw="$(skopeo inspect --raw "docker://${IMAGE}@${DIGEST}")"
          [[ "$(jq -r '[.manifests[].platform.architecture] | sort | join(" ")' <<< "$raw")" == 'amd64 arm64' ]]
          [[ "$(jq -r '[.manifests[].digest] | sort | join(" ")' <<< "$raw")" == "$(printf '%s\n' "$X86_64_DIGEST" "$AARCH64_DIGEST" | sort | paste -sd ' ')" ]]
          jq -e --arg version "$VERSION" --arg revision "$REVISION" --arg created "$CREATED" \
            --arg fsdk_version "$FSDK_VERSION" --arg fsdk_ref "$FSDK_REF" \
            '.annotations["org.opencontainers.image.title"] == "ps-printer-app" and
             .annotations["org.opencontainers.image.version"] == $version and
             .annotations["org.opencontainers.image.revision"] == $revision and
             .annotations["org.opencontainers.image.created"] == $created and
             .annotations["io.projectbluefin.fsdk.version"] == $fsdk_version and
             .annotations["io.projectbluefin.fsdk.ref"] == $fsdk_ref' <<< "$raw"
      - name: Tag the verified image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
          X86_64_DIGEST: ${{ steps.image.outputs.x86_64-digest }}
          AARCH64_DIGEST: ${{ steps.image.outputs.aarch64-digest }}
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
        run: |
          set -euo pipefail
          # sha-<commit> is immutable (metadata refuses a published commit);
          # <VERSION>, its per-arch tags and stable move to the newest main commit.
          oras tag "${IMAGE}@${DIGEST}" "sha-${REVISION}"
          oras tag "${IMAGE}@${X86_64_DIGEST}" "${VERSION}-x86_64"
          oras tag "${IMAGE}@${AARCH64_DIGEST}" "${VERSION}-aarch64"
          oras tag "${IMAGE}@${DIGEST}" "${VERSION}"
          [[ "$(skopeo inspect --raw "docker://${IMAGE}:${VERSION}" | sha256sum | cut -d' ' -f1)" == "${DIGEST#sha256:}" ]]
          oras tag "${IMAGE}@${DIGEST}" stable
